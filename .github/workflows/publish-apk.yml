name: Publish Debug APK Release

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'apk-distribution/app-debug.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate APK and Checksum
        run: |
          set -e
          echo "=== Validating APK File and Checksum ==="
          
          if [ ! -f "apk-distribution/app-debug.apk" ]; then
            echo "::error::apk-distribution/app-debug.apk does not exist!"
            exit 1
          fi

          if [ ! -s "apk-distribution/app-debug.apk" ]; then
            echo "::error::apk-distribution/app-debug.apk is empty!"
            exit 1
          fi

          if [ ! -f "apk-distribution/app-debug.apk.sha256" ]; then
            echo "::error::apk-distribution/app-debug.apk.sha256 does not exist!"
            exit 1
          fi

          echo "Verifying SHA-256 checksum..."
          (cd apk-distribution && sha256sum -c app-debug.apk.sha256)

          echo "Verifying ZIP archive integrity..."
          unzip -tq apk-distribution/app-debug.apk

          echo "APK validation successful."

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }} (Attempt ${{ github.run_attempt }})"
          APK_PATH="apk-distribution/app-debug.apk"
          
          APK_SIZE=$(ls -lh "$APK_PATH" | awk '{print $5}')
          APK_SHA=$(sha256sum "$APK_PATH" | awk '{print $1}')
          
          echo "Publishing release with tag: $TAG"
          gh release create "$TAG" "$APK_PATH" \
            --title "$TITLE" \
            --notes "Automated publication of pre-compiled debug APK ($APK_SIZE, SHA-256: $APK_SHA)." \
            --latest

          REPO_URL="https://github.com/${{ github.repository }}"
          RELEASE_URL="${REPO_URL}/releases/tag/${TAG}"
          DIRECT_DOWNLOAD_URL="${REPO_URL}/releases/latest/download/app-debug.apk"

          echo "### 🚀 Debug APK Published Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Tag:** \`${TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **APK File:** \`app-debug.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **File Size:** ${APK_SIZE}" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA-256:** \`${APK_SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Page:** [View Release](${RELEASE_URL})" >> $GITHUB_STEP_SUMMARY
          echo "- **Direct APK Download:** [Download app-debug.apk](${DIRECT_DOWNLOAD_URL})" >> $GITHUB_STEP_SUMMARY
